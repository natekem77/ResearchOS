[project]
name = "researchos-backend"
version = "0.1.0"
description = "FastAPI backend foundation for ResearchOS."
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "ResearchOS contributors" }
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "chromadb>=0.5.0,<1.0.0",
    "msal>=1.30.0,<2.0.0",
    "pypdf>=4.3.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0,<2.0.0",
    "pytest>=8.2.0,<9.0.0",
    "ruff>=0.5.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
