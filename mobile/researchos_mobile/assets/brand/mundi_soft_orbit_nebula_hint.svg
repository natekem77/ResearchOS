<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Mundi Soft Orbit Nebula Hint logo">
  <defs>
    <radialGradient id="space" cx="52%" cy="44%" r="78%">
      <stop offset="0%" stop-color="#0A2444"/>
      <stop offset="58%" stop-color="#07172F"/>
      <stop offset="100%" stop-color="#041020"/>
    </radialGradient>
    <radialGradient id="nebula" cx="69%" cy="43%" r="44%">
      <stop offset="0%" stop-color="#5FD4FF" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#2B7CFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2B7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="330" y1="548" x2="620" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5FD4FF" stop-opacity="0"/>
      <stop offset="48%" stop-color="#5FD4FF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#5FD4FF" stop-opacity="0.86"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="24%" stop-color="#5FD4FF" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#5FD4FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#space)"/>
  <ellipse cx="692" cy="438" rx="270" ry="210" fill="url(#nebula)"/>

