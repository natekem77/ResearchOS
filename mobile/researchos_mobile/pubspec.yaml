name: researchos_mobile
description: Mobile preview shell for ResearchOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.5.1
  file_picker: ^8.1.7
  fl_chart: ^0.69.0
  html: ^0.15.6
  http: ^1.2.2
  http_parser: ^4.0.2
  path_provider: ^2.1.5
  quill_native_bridge: ^11.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/dev/notebook_test_image.png
